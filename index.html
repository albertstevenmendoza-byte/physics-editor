<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Lab — LaTeX + Diagram Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --bg2: #13161e;
  --bg3: #1a1e28;
  --bg4: #222736;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8eaf0;
  --text2: #8a8fa8;
  --text3: #5a5f78;
  --accent: #7c6bff;
  --accent2: #9d8fff;
  --accent-dim: rgba(124,107,255,0.15);
  --accent-glow: rgba(124,107,255,0.08);
  --green: #3ecf8e;
  --green-dim: rgba(62,207,142,0.12);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.12);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.12);
  --mono: 'JetBrains Mono', monospace;
  --head: 'Syne', sans-serif;
  --body: 'DM Sans', sans-serif;
  --radius: 8px;
  --radius-lg: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--body); }

/* ── App shell ── */
.app { display: flex; flex-direction: column; height: 100vh; }

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; height: 46px; min-height: 46px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo { font-family: var(--head); font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.logo span { color: var(--accent2); }
.doc-select {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); font-family: var(--body); font-size: 12px;
  padding: 4px 8px; border-radius: var(--radius); cursor: pointer; outline: none;
}
.doc-select:focus { border-color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 8px; }
.hbtn {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; font-family: var(--body);
  padding: 5px 10px; border-radius: var(--radius);
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2); cursor: pointer; transition: all 0.15s;
}
.hbtn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }
.hbtn.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent2); }
.hbtn.primary:hover { background: rgba(124,107,255,0.25); }
.save-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.save-indicator.unsaved { background: var(--amber); }

/* ── Mode tabs ── */
.mode-bar {
  display: flex; align-items: center; gap: 2px;
  padding: 0 16px; height: 38px; min-height: 38px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.mode-tab {
  font-size: 12px; font-family: var(--body); font-weight: 500;
  padding: 5px 12px; border-radius: var(--radius);
  border: none; background: transparent;
  color: var(--text3); cursor: pointer; transition: all 0.15s;
}
.mode-tab:hover { color: var(--text2); background: var(--bg3); }
.mode-tab.active { color: var(--accent2); background: var(--accent-dim); }
.mode-sep { width: 1px; height: 16px; background: var(--border); margin: 0 6px; }

/* ── Workspace ── */
.workspace { display: flex; flex: 1; overflow: hidden; }

/* ── LATEX PANEL ── */
.latex-panel { display: flex; flex-direction: column; flex: 1; min-width: 0; border-right: 1px solid var(--border); }
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; height: 36px; min-height: 36px;
  border-bottom: 1px solid var(--border); background: var(--bg2);
}
.panel-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); font-family: var(--head); }
.panel-actions { display: flex; gap: 4px; }
.pabtn {
  font-size: 11px; font-family: var(--mono); padding: 2px 7px;
  border-radius: 4px; border: 1px solid var(--border);
  background: transparent; color: var(--text3); cursor: pointer; transition: all 0.12s;
}
.pabtn:hover { color: var(--text2); border-color: var(--border2); background: var(--bg3); }

/* Toolbar */
.toolbar {
  display: flex; align-items: center; gap: 4px; padding: 6px 10px;
  border-bottom: 1px solid var(--border); background: var(--bg2);
  flex-wrap: wrap;
}
.tb-group { display: flex; gap: 3px; }
.tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }
.tb-label { font-size: 10px; color: var(--text3); font-family: var(--head); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 0 3px; align-self: center; }
.tbbtn {
  font-size: 12px; font-family: var(--mono); padding: 3px 7px;
  border-radius: 4px; border: 1px solid transparent;
  background: transparent; color: var(--text2); cursor: pointer;
  transition: all 0.1s; white-space: nowrap;
}
.tbbtn:hover { background: var(--bg3); color: var(--accent2); border-color: var(--border); }

/* Editor */
.editor-wrap { flex: 1; position: relative; overflow: hidden; }
#latex-input {
  width: 100%; height: 100%;
  resize: none; border: none; outline: none;
  padding: 14px 16px;
  font-family: var(--mono); font-size: 13px; line-height: 1.75;
  color: var(--text); background: var(--bg);
  caret-color: var(--accent2);
}
#latex-input::placeholder { color: var(--text3); }
#latex-input::selection { background: var(--accent-dim); }

/* ── PREVIEW PANEL ── */
.preview-panel { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.preview-body {
  flex: 1; overflow-y: auto; padding: 20px 24px;
  background: var(--bg); color: var(--text);
  font-family: var(--body); font-size: 15px; line-height: 1.85;
}
.preview-body p { margin: 0.3em 0; }
.preview-body .mjx-chtml { color: var(--text) !important; }
.err-bar {
  font-size: 11px; color: var(--red); padding: 5px 12px;
  background: var(--red-dim); border-top: 1px solid rgba(248,113,113,0.2);
  font-family: var(--mono); display: none;
}
.render-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); transition: background 0.2s; }
.status-dot.rendering { background: var(--amber); }
.status-dot.error { background: var(--red); }

/* ── DIAGRAM PANEL ── */
.diagram-panel { display: none; flex-direction: column; flex: 1; min-width: 0; }
.diagram-panel.visible { display: flex; }

.draw-toolbar {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  border-bottom: 1px solid var(--border); background: var(--bg2); flex-wrap: wrap;
}
.draw-tool-btn {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 28px; border-radius: var(--radius);
  border: 1px solid transparent; background: transparent;
  color: var(--text2); cursor: pointer; font-size: 14px; transition: all 0.12s;
}
.draw-tool-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border); }
.draw-tool-btn.active { background: var(--accent-dim); color: var(--accent2); border-color: var(--accent); }
.color-swatch {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; transition: all 0.12s;
}
.color-swatch.active { border-color: var(--text); transform: scale(1.15); }
.draw-sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }
.size-label { font-size: 11px; color: var(--text3); font-family: var(--mono); }
#stroke-size { width: 70px; accent-color: var(--accent); cursor: pointer; }
.draw-action-btn {
  font-size: 11px; font-family: var(--body); padding: 3px 9px;
  border-radius: 4px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); cursor: pointer; transition: all 0.12s;
}
.draw-action-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }
.draw-action-btn.danger:hover { background: var(--red-dim); color: var(--red); border-color: rgba(248,113,113,0.3); }

.canvas-wrap { flex: 1; overflow: hidden; position: relative; background: var(--bg); }
#draw-canvas { display: block; cursor: crosshair; touch-action: none; }

/* ── SPLIT MODE ── */
.workspace.split-mode .latex-panel { flex: 0 0 40%; }
.workspace.split-mode .preview-panel { flex: 0 0 30%; }
.workspace.split-mode .diagram-panel { flex: 0 0 30%; display: flex; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ── MathJax color override ── */
.MJX-TEX { color: var(--text) !important; }
mjx-container { color: var(--text) !important; }

/* ── New doc dialog ── */
.dialog-overlay {
  display: none; position: absolute; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.6); align-items: center; justify-content: center;
}
.dialog-overlay.open { display: flex; }
.dialog {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); padding: 20px 24px; width: 320px;
}
.dialog h3 { font-family: var(--head); font-size: 15px; margin-bottom: 12px; color: var(--text); }
.dialog input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); font-family: var(--body); font-size: 13px;
  padding: 7px 10px; border-radius: var(--radius); outline: none; margin-bottom: 12px;
}
.dialog input:focus { border-color: var(--accent); }
.dialog-btns { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">Physics<span>Lab</span></div>
      <select class="doc-select" id="doc-select" onchange="loadDoc(this.value)"></select>
    </div>
    <div class="header-right">
      <div class="save-indicator" id="save-dot" title="All changes saved"></div>
      <button class="hbtn" onclick="newDocDialog()">+ new</button>
      <button class="hbtn" onclick="deleteDoc()" style="color:var(--text3);">delete</button>
      <button class="hbtn" onclick="downloadTex()">↓ .tex</button>
      <button class="hbtn" onclick="downloadDiagram()">↓ diagram</button>
      <button class="hbtn primary" onclick="window.print()">print / pdf</button>
    </div>
  </header>

  <!-- Mode bar -->
  <div class="mode-bar">
    <button class="mode-tab active" id="tab-latex" onclick="setMode('latex')">LaTeX only</button>
    <button class="mode-tab" id="tab-diagram" onclick="setMode('diagram')">diagram only</button>
    <button class="mode-tab" id="tab-split" onclick="setMode('split')">split view</button>
    <div class="mode-sep"></div>
    <span style="font-size:11px;color:var(--text3);font-family:var(--body);">auto-saved · <span id="last-saved">just now</span></span>
  </div>

  <!-- Workspace -->
  <div class="workspace" id="workspace">

    <!-- LaTeX panel -->
    <div class="latex-panel" id="latex-panel">
      <div class="panel-header">
        <span class="panel-label">source</span>
        <div class="panel-actions">
          <button class="pabtn" onclick="insertMacros()">inject physics macros</button>
          <button class="pabtn" onclick="clearEditor()">clear</button>
        </div>
      </div>
      <div class="toolbar">
        <span class="tb-label">math</span>
        <div class="tb-group">
          <button class="tbbtn" onclick="ins('\\\\frac{}{}')" title="fraction">\frac</button>
          <button class="tbbtn" onclick="ins('\\\\sqrt{}')">\sqrt</button>
          <button class="tbbtn" onclick="ins('\\\\int_{  }^{  } ')">\int</button>
          <button class="tbbtn" onclick="ins('\\\\oint ')">\oint</button>
          <button class="tbbtn" onclick="ins('\\\\sum_{i=0}^{n}')">\sum</button>
          <button class="tbbtn" onclick="ins('\\\\prod_{i=0}^{n}')">\prod</button>
          <button class="tbbtn" onclick="ins('\\\\lim_{x \\\\to 0}')">\lim</button>
          <button class="tbbtn" onclick="ins('\\\\partial')">\partial</button>
          <button class="tbbtn" onclick="ins('\\\\nabla')">\nabla</button>
          <button class="tbbtn" onclick="ins('\\\\infty')">\infty</button>
        </div>
        <div class="tb-sep"></div>
        <span class="tb-label">greek</span>
        <div class="tb-group">
          <button class="tbbtn" onclick="ins('\\\\alpha')">&alpha;</button>
          <button class="tbbtn" onclick="ins('\\\\beta')">&beta;</button>
          <button class="tbbtn" onclick="ins('\\\\gamma')">&gamma;</button>
          <button class="tbbtn" onclick="ins('\\\\Gamma')">&Gamma;</button>
          <button class="tbbtn" onclick="ins('\\\\delta')">&delta;</button>
          <button class="tbbtn" onclick="ins('\\\\Delta')">&Delta;</button>
          <button class="tbbtn" onclick="ins('\\\\theta')">&theta;</button>
          <button class="tbbtn" onclick="ins('\\\\lambda')">&lambda;</button>
          <button class="tbbtn" onclick="ins('\\\\mu')">&mu;</button>
          <button class="tbbtn" onclick="ins('\\\\nu')">&nu;</button>
          <button class="tbbtn" onclick="ins('\\\\psi')">&psi;</button>
          <button class="tbbtn" onclick="ins('\\\\Psi')">&Psi;</button>
          <button class="tbbtn" onclick="ins('\\\\phi')">&phi;</button>
          <button class="tbbtn" onclick="ins('\\\\Phi')">&Phi;</button>
          <button class="tbbtn" onclick="ins('\\\\omega')">&omega;</button>
          <button class="tbbtn" onclick="ins('\\\\Omega')">&Omega;</button>
          <button class="tbbtn" onclick="ins('\\\\sigma')">&sigma;</button>
          <button class="tbbtn" onclick="ins('\\\\rho')">&rho;</button>
          <button class="tbbtn" onclick="ins('\\\\epsilon')">&epsilon;</button>
          <button class="tbbtn" onclick="ins('\\\\hbar')">ℏ</button>
        </div>
        <div class="tb-sep"></div>
        <span class="tb-label">env</span>
        <div class="tb-group">
          <button class="tbbtn" onclick="ins('\\\\begin{align}\n  \n\\\\end{align}')">align</button>
          <button class="tbbtn" onclick="ins('\\\\begin{cases}\n  & \\\\\\\\\n  & \n\\\\end{cases}')">cases</button>
          <button class="tbbtn" onclick="ins('\\\\begin{pmatrix}\n   &  \\\\\\\\\n   & \n\\\\end{pmatrix}')">matrix</button>
          <button class="tbbtn" onclick="ins('\\\\boxed{}')">\boxed</button>
        </div>
        <div class="tb-sep"></div>
        <span class="tb-label">vectors</span>
        <div class="tb-group">
          <button class="tbbtn" onclick="ins('\\\\vec{}')">\vec</button>
          <button class="tbbtn" onclick="ins('\\\\hat{}')">\hat</button>
          <button class="tbbtn" onclick="ins('\\\\mathbf{}')">\mathbf</button>
          <button class="tbbtn" onclick="ins('\\\\left(  \\\\right)')">\left</button>
        </div>
        <div class="tb-sep"></div>
        <span class="tb-label">QM</span>
        <div class="tb-group">
          <button class="tbbtn" onclick="ins('\\\\langle  \\\\rangle')">&lang;&rang;</button>
          <button class="tbbtn" onclick="ins('|\\\\psi\\\\rangle')">|ψ⟩</button>
          <button class="tbbtn" onclick="ins('\\\\langle\\\\phi|')" >⟨φ|</button>
          <button class="tbbtn" onclick="ins('\\\\langle\\\\phi|\\\\hat{H}|\\\\psi\\\\rangle')">⟨φ|H|ψ⟩</button>
        </div>
      </div>
      <div class="editor-wrap">
        <textarea id="latex-input" spellcheck="false"
          placeholder="Start writing LaTeX...

$E = mc^2$ for inline math, or display math:

$$\hat{H}\Psi = i\hbar\frac{\partial \Psi}{\partial t}$$

Use \begin{align}...\end{align} for multi-line derivations."></textarea>
      </div>
    </div>

    <!-- Preview panel -->
    <div class="preview-panel" id="preview-panel">
      <div class="panel-header">
        <span class="panel-label">rendered</span>
        <div class="render-status">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text" style="font-size:10px;font-family:var(--mono);">live</span>
        </div>
      </div>
      <div class="preview-body" id="preview-body"></div>
      <div class="err-bar" id="err-bar"></div>
    </div>

    <!-- Diagram panel -->
    <div class="diagram-panel" id="diagram-panel">
      <div class="panel-header">
        <span class="panel-label">diagram</span>
        <div class="panel-actions">
          <button class="pabtn" onclick="downloadDiagram()">↓ png</button>
        </div>
      </div>
      <div class="draw-toolbar">
        <button class="draw-tool-btn active" id="tool-pen" onclick="setTool('pen')" title="Pen (p)">✏️</button>
        <button class="draw-tool-btn" id="tool-line" onclick="setTool('line')" title="Line (l)">╱</button>
        <button class="draw-tool-btn" id="tool-arrow" onclick="setTool('arrow')" title="Arrow (a)">→</button>
        <button class="draw-tool-btn" id="tool-rect" onclick="setTool('rect')" title="Rectangle (r)">▭</button>
        <button class="draw-tool-btn" id="tool-circle" onclick="setTool('circle')" title="Circle (c)">○</button>
        <button class="draw-tool-btn" id="tool-text" onclick="setTool('text')" title="Text (t)">T</button>
        <button class="draw-tool-btn" id="tool-eraser" onclick="setTool('eraser')" title="Eraser (e)">◻</button>
        <div class="draw-sep"></div>
        <div id="color-palette" style="display:flex;gap:5px;align-items:center;">
          <div class="color-swatch active" style="background:#e8eaf0" data-color="#e8eaf0" onclick="setColor('#e8eaf0',this)"></div>
          <div class="color-swatch" style="background:#7c6bff" data-color="#7c6bff" onclick="setColor('#7c6bff',this)"></div>
          <div class="color-swatch" style="background:#3ecf8e" data-color="#3ecf8e" onclick="setColor('#3ecf8e',this)"></div>
          <div class="color-swatch" style="background:#f59e0b" data-color="#f59e0b" onclick="setColor('#f59e0b',this)"></div>
          <div class="color-swatch" style="background:#f87171" data-color="#f87171" onclick="setColor('#f87171',this)"></div>
          <div class="color-swatch" style="background:#60a5fa" data-color="#60a5fa" onclick="setColor('#60a5fa',this)"></div>
        </div>
        <div class="draw-sep"></div>
        <span class="size-label">size</span>
        <input type="range" id="stroke-size" min="1" max="16" value="2" oninput="setStrokeSize(this.value)">
        <span class="size-label" id="size-val">2</span>
        <div class="draw-sep"></div>
        <button class="draw-action-btn" onclick="undoDraw()">↩ undo</button>
        <button class="draw-action-btn danger" onclick="clearCanvas()">clear</button>
      </div>
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="draw-canvas"></canvas>
      </div>
    </div>

  </div>
</div>

<!-- New doc dialog -->
<div class="dialog-overlay" id="new-doc-dialog">
  <div class="dialog">
    <h3>New document</h3>
    <input type="text" id="new-doc-name" placeholder="e.g. classical-mechanics, qm-hw2..." maxlength="40">
    <div class="dialog-btns">
      <button class="hbtn" onclick="closeDialog()">cancel</button>
      <button class="hbtn primary" onclick="createDoc()">create</button>
    </div>
  </div>
</div>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$','$'],['\\(','\\)']],
    displayMath: [['$$','$$'],['\\[','\\]']],
    packages: { '[+]': ['base','ams','newcommand'] },
    macros: {
      dv: ['\\frac{d#1}{d#2}', 2],
      pdv: ['\\frac{\\partial #1}{\\partial #2}', 2],
      ket: ['\\left|#1\\right\\rangle', 1],
      bra: ['\\left\\langle#1\\right|', 1],
      braket: ['\\left\\langle#1\\middle|#2\\right\\rangle', 2],
      mel: ['\\left\\langle#1\\middle|#2\\middle|#3\\right\\rangle', 3],
      comm: ['\\left[#1,\\,#2\\right]', 2],
      acomm: ['\\left\\{#1,\\,#2\\right\\}', 2],
      Lag: '\\mathcal{L}',
      Ham: '\\mathcal{H}',
      vb: ['\\mathbf{#1}', 1],
      abs: ['\\left|#1\\right|', 1],
      norm: ['\\left\\|#1\\right\\|', 1]
    }
  },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] },
  startup: { ready() { MathJax.startup.defaultReady(); } }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

<script>
/* ── STORAGE ── */
const STORAGE_KEY = 'physlab_docs';
const CANVAS_KEY  = 'physlab_canvas';

function getDocs() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}
function saveDocs(docs) { localStorage.setItem(STORAGE_KEY, JSON.stringify(docs)); }
function getCanvases() {
  try { return JSON.parse(localStorage.getItem(CANVAS_KEY)) || {}; } catch(e) { return {}; }
}
function saveCanvases(c) { localStorage.setItem(CANVAS_KEY, JSON.stringify(c)); }

let currentDoc = null;
let mjReady = false;
let renderTimer = null;
let saveTimer = null;

/* ── DOC MANAGEMENT ── */
function populateDocSelect() {
  const docs = getDocs();
  const sel = document.getElementById('doc-select');
  sel.innerHTML = '';
  let keys = Object.keys(docs);
  if (!keys.length) { createDefaultDoc(); return; }
  keys.forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = k;
    if (k === currentDoc) o.selected = true;
    sel.appendChild(o);
  });
}

function createDefaultDoc() {
  const docs = getDocs();
  const name = 'untitled-1';
  docs[name] = `The Schrödinger equation:
$$i\\hbar\\frac{\\partial}{\\partial t}\\Psi = \\hat{H}\\Psi$$

For a free particle, the Hamiltonian is:
$$\\hat{H} = -\\frac{\\hbar^2}{2m}\\nabla^2$$

The time-independent form:
\\begin{align}
  \\hat{H}\\psi &= E\\psi \\\\
  -\\frac{\\hbar^2}{2m}\\frac{d^2\\psi}{dx^2} &= E\\psi
\\end{align}

Momentum operator: $\\hat{p} = -i\\hbar\\nabla$

Commutator: $\\comm{\\hat{x}}{\\hat{p}} = i\\hbar$`;
  saveDocs(docs);
  currentDoc = name;
  populateDocSelect();
  loadDoc(name);
}

function loadDoc(name) {
  currentDoc = name;
  const docs = getDocs();
  document.getElementById('latex-input').value = docs[name] || '';
  document.getElementById('doc-select').value = name;
  scheduleRender();
  loadCanvasForDoc(name);
  markSaved();
}

function newDocDialog() {
  document.getElementById('new-doc-dialog').classList.add('open');
  document.getElementById('new-doc-name').value = '';
  document.getElementById('new-doc-name').focus();
}
function closeDialog() {
  document.getElementById('new-doc-dialog').classList.remove('open');
}
function createDoc() {
  const name = document.getElementById('new-doc-name').value.trim().replace(/\s+/g,'-') || ('doc-' + Date.now());
  const docs = getDocs();
  docs[name] = '';
  saveDocs(docs);
  closeDialog();
  currentDoc = name;
  populateDocSelect();
  loadDoc(name);
}
function deleteDoc() {
  if (!currentDoc) return;
  if (!confirm(`Delete "${currentDoc}"?`)) return;
  const docs = getDocs();
  delete docs[currentDoc];
  const cvs = getCanvases();
  delete cvs[currentDoc];
  saveCanvases(cvs);
  saveDocs(docs);
  currentDoc = null;
  const keys = Object.keys(docs);
  if (keys.length) { currentDoc = keys[0]; }
  populateDocSelect();
  if (currentDoc) loadDoc(currentDoc); else createDefaultDoc();
}
document.getElementById('new-doc-name').addEventListener('keydown', e => { if (e.key === 'Enter') createDoc(); if (e.key === 'Escape') closeDialog(); });

/* ── SAVE ── */
function markUnsaved() {
  document.getElementById('save-dot').classList.add('unsaved');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autoSave, 1000);
}
function markSaved() {
  document.getElementById('save-dot').classList.remove('unsaved');
  document.getElementById('last-saved').textContent = 'just now';
}
function autoSave() {
  if (!currentDoc) return;
  const docs = getDocs();
  docs[currentDoc] = document.getElementById('latex-input').value;
  saveDocs(docs);
  saveCanvasForDoc(currentDoc);
  markSaved();
}

/* ── MODES ── */
let currentMode = 'latex';
function setMode(mode) {
  currentMode = mode;
  ['latex','diagram','split'].forEach(m => {
    document.getElementById('tab-' + m).classList.toggle('active', m === mode);
  });
  const ws = document.getElementById('workspace');
  const lp = document.getElementById('latex-panel');
  const pp = document.getElementById('preview-panel');
  const dp = document.getElementById('diagram-panel');
  ws.classList.remove('split-mode');
  dp.classList.remove('visible');
  if (mode === 'latex') {
    lp.style.display = 'flex'; pp.style.display = 'flex'; dp.style.display = 'none';
    lp.style.flex = '1'; pp.style.flex = '1';
  } else if (mode === 'diagram') {
    lp.style.display = 'none'; pp.style.display = 'none';
    dp.style.display = 'flex'; dp.classList.add('visible');
    dp.style.flex = '1';
    setTimeout(resizeCanvas, 50);
  } else if (mode === 'split') {
    lp.style.display = 'flex'; pp.style.display = 'flex';
    dp.style.display = 'flex'; dp.classList.add('visible');
    ws.classList.add('split-mode');
    setTimeout(resizeCanvas, 50);
  }
}

/* ── LATEX EDITOR ── */
const input = document.getElementById('latex-input');
const preview = document.getElementById('preview-body');
const errBar = document.getElementById('err-bar');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

input.addEventListener('input', () => { markUnsaved(); scheduleRender(); });

function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 280);
}

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function latexToHTML(raw) {
  const lines = raw.split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const tr = line.trim();
    const envMatch = tr.match(/^\\begin\{(align\*?|gather\*?|multline\*?|equation\*?|cases)\}/);
    if (envMatch) {
      const envLines = [line];
      while (i + 1 < lines.length) {
        i++;
        envLines.push(lines[i]);
        if (/^\\end\{/.test(lines[i].trim())) break;
      }
      html += '<div style="margin:0.8em 0;overflow-x:auto;">\\[' + envLines.join('\n') + '\\]</div>';
    } else if (tr === '') {
      html += '<p style="margin:0.3em 0">&nbsp;</p>';
    } else {
      html += '<p style="margin:0.2em 0">' + escapeHTML(line) + '</p>';
    }
    i++;
  }
  return html;
}

function render() {
  if (!mjReady) return;
  statusDot.className = 'status-dot rendering';
  statusText.textContent = '…';
  preview.innerHTML = latexToHTML(input.value);
  MathJax.typesetPromise([preview]).then(() => {
    statusDot.className = 'status-dot';
    statusText.textContent = 'live';
    errBar.style.display = 'none';
  }).catch(e => {
    statusDot.className = 'status-dot error';
    statusText.textContent = 'err';
    errBar.style.display = 'block';
    errBar.textContent = String(e);
  });
}

function waitForMJ(tries) {
  tries = tries || 0;
  if (window.MathJax && window.MathJax.typesetPromise) {
    mjReady = true; render();
  } else if (tries < 80) {
    setTimeout(() => waitForMJ(tries + 1), 200);
  }
}
waitForMJ();

/* ── INSERT SNIPPET ── */
function ins(snippet) {
  const s = input.selectionStart, e = input.selectionEnd;
  input.value = input.value.slice(0, s) + snippet + input.value.slice(e);
  input.setSelectionRange(s + snippet.length, s + snippet.length);
  input.focus();
  markUnsaved(); scheduleRender();
}
window.ins = ins;

function insertMacros() {
  ins('\n% Physics macros (built-in):\n% \\dv{f}{x}  \\pdv{f}{x}  \\ket{\\psi}  \\bra{\\phi}\n% \\braket{\\phi}{\\psi}  \\mel{n}{H}{m}\n% \\comm{A}{B}  \\Lag  \\Ham  \\abs{x}  \\norm{x}\n');
}
function clearEditor() {
  if (confirm('Clear editor?')) { input.value = ''; markUnsaved(); scheduleRender(); }
}
function downloadTex() {
  const blob = new Blob([input.value], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (currentDoc || 'physics') + '.tex';
  a.click();
}

/* ── DRAWING ── */
const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d');
let tool = 'pen';
let drawColor = '#e8eaf0';
let strokeSize = 2;
let isDrawing = false;
let startX = 0, startY = 0;
let history = [];
let snapshot = null;

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  canvas.width = w; canvas.height = h;
  ctx.fillStyle = '#0d0f14';
  ctx.fillRect(0, 0, w, h);
  ctx.putImageData(imgData, 0, 0);
}

function setTool(t) {
  tool = t;
  document.querySelectorAll('.draw-tool-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tool-' + t);
  if (el) el.classList.add('active');
  canvas.style.cursor = t === 'eraser' ? 'cell' : (t === 'text' ? 'text' : 'crosshair');
}
function setColor(c, el) {
  drawColor = c;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}
function setStrokeSize(v) {
  strokeSize = parseInt(v);
  document.getElementById('size-val').textContent = v;
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

function pushHistory() {
  history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (history.length > 40) history.shift();
}

function drawArrow(x1, y1, x2, y2) {
  const headLen = Math.max(10, strokeSize * 4);
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI/6), y2 - headLen * Math.sin(angle - Math.PI/6));
  ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI/6), y2 - headLen * Math.sin(angle + Math.PI/6));
  ctx.closePath();
  ctx.fillStyle = drawColor;
  ctx.fill();
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', continueDraw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); continueDraw(e); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); endDraw(e); }, { passive: false });

function startDraw(e) {
  if (tool === 'text') { handleTextTool(e); return; }
  const p = getPos(e);
  startX = p.x; startY = p.y;
  isDrawing = true;
  pushHistory();
  snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = tool === 'eraser' ? '#0d0f14' : drawColor;
  ctx.fillStyle = drawColor;
  ctx.lineWidth = tool === 'eraser' ? strokeSize * 6 : strokeSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (tool === 'pen' || tool === 'eraser') {
    ctx.beginPath();
    ctx.moveTo(startX, startY);
  }
}

function continueDraw(e) {
  if (!isDrawing) return;
  const p = getPos(e);
  if (tool === 'pen' || tool === 'eraser') {
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  } else if (snapshot) {
    ctx.putImageData(snapshot, 0, 0);
    ctx.strokeStyle = drawColor;
    ctx.fillStyle = 'transparent';
    ctx.lineWidth = strokeSize;
    ctx.lineCap = 'round';
    if (tool === 'line') {
      ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(p.x, p.y); ctx.stroke();
    } else if (tool === 'arrow') {
      drawArrow(startX, startY, p.x, p.y);
    } else if (tool === 'rect') {
      ctx.beginPath();
      ctx.strokeRect(startX, startY, p.x - startX, p.y - startY);
    } else if (tool === 'circle') {
      const rx = (p.x - startX) / 2, ry = (p.y - startY) / 2;
      ctx.beginPath();
      ctx.ellipse(startX + rx, startY + ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

function endDraw(e) {
  if (!isDrawing) return;
  isDrawing = false;
  snapshot = null;
  scheduleCanvasSave();
}

function handleTextTool(e) {
  const p = getPos(e);
  const text = prompt('Text to draw:');
  if (!text) return;
  pushHistory();
  ctx.font = `${Math.max(14, strokeSize * 5)}px 'JetBrains Mono', monospace`;
  ctx.fillStyle = drawColor;
  ctx.fillText(text, p.x, p.y);
  scheduleCanvasSave();
}

function undoDraw() {
  if (!history.length) return;
  ctx.putImageData(history.pop(), 0, 0);
  scheduleCanvasSave();
}

function clearCanvas() {
  if (!confirm('Clear the diagram?')) return;
  pushHistory();
  ctx.fillStyle = '#0d0f14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  scheduleCanvasSave();
}

let canvasSaveTimer = null;
function scheduleCanvasSave() {
  clearTimeout(canvasSaveTimer);
  canvasSaveTimer = setTimeout(() => saveCanvasForDoc(currentDoc), 800);
}

function saveCanvasForDoc(name) {
  if (!name || !canvas.width) return;
  const cvs = getCanvases();
  cvs[name] = canvas.toDataURL('image/png');
  saveCanvases(cvs);
}

function loadCanvasForDoc(name) {
  resizeCanvas();
  const cvs = getCanvases();
  if (cvs[name]) {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0); };
    img.src = cvs[name];
  }
}

function downloadDiagram() {
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = (currentDoc || 'diagram') + '.png';
  a.click();
}

/* ── KEYBOARD SHORTCUTS ── */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 's') { e.preventDefault(); autoSave(); }
  }
  if (document.activeElement !== input) {
    const map = { 'p': 'pen', 'l': 'line', 'a': 'arrow', 'r': 'rect', 'c': 'circle', 't': 'text', 'e': 'eraser' };
    if (map[e.key] && (currentMode === 'diagram' || currentMode === 'split')) setTool(map[e.key]);
  }
});

/* ── INIT ── */
window.addEventListener('resize', () => {
  if (currentMode === 'diagram' || currentMode === 'split') resizeCanvas();
});

populateDocSelect();
const docs = getDocs();
const keys = Object.keys(docs);
if (keys.length) { currentDoc = keys[0]; loadDoc(currentDoc); }
</script>
